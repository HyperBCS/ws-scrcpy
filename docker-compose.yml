# Both platforms from one container. The host keeps ownership of the USB devices:
# usbmuxd claims the Apple ones, the adb server claims the Android ones, and
# ws-scrcpy talks to both over their sockets. Nothing here is privileged.
#
# Host networking is deliberate, not laziness:
#   * adbkit defaults to 127.0.0.1:5037 (src/server/goog-device/adb/index.ts), and
#     Device.ts and RemoteShell.ts spawn `adb -s <serial> shell` with no -H flag, so they
#     too go to 127.0.0.1:5037. Under bridge networking a spawned client would fork
#     its own server inside the container, blind to USB, while adbkit used the host's.
#     adbkit itself never starts a server: start the host's adb server before this.
#   * Android video/audio/control use a loopback TCP forward owned by the host adb
#     daemon, so they also share its network namespace without mounting the host /tmp.
#   * CoreDeviceRunner binds each device's serve-web to loopback (it has no auth);
#     sharing the host netns is what lets the server reach it.
#   * The HTTP server binds 8000 (and 8443 when configured) directly on the host.
#
# Verified on hardware 2026-09-21: the iOS path (tunnel, screenshot, serve-web, HEVC
# stream, clean teardown) works with only the usbmuxd socket mounted.
#
# Not yet run in Docker (2026-11-11): the unprivileged user, `init`, `cap_drop`, the
# health check and the 80 s grace below. See the notes on each.
services:
  ws-scrcpy:
    image: ws-scrcpy:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ws-scrcpy
    restart: unless-stopped
    # Reaps the children that outlive their parent (adb, ffmpeg, python) and passes SIGTERM on to
    # the server, which stops its own children in order.
    init: true
    # How long `docker stop` waits before SIGKILL. It must outlast the server's own shutdown
    # budget, CoreDeviceRunner.shutdownBudgetMs(): 35 s for a serve-web still in its preflight to
    # become able to handle SIGTERM, 30 s for it to return the phone's display sessions, and 5 s.
    # That is 70 s; this adds 10 s. A shorter grace cuts serve-web off with SIGKILL, which is what
    # wedges the phone's display service. scripts/test-web-security.js compares the two numbers.
    stop_grace_period: 80s
    network_mode: host
    # Load config/apparmor-ws-scrcpy on the host before starting (see README).
    security_opt:
      - apparmor=ws-scrcpy-bluetooth
    # Nothing in the container opens raw sockets. The server runs as `node` (see
    # config/docker-entrypoint.sh), which has no capabilities at all.
    cap_drop:
      - NET_RAW
    # The host's bluetooth group, for hosts whose D-Bus policy lets only that group talk to BlueZ.
    # `getent group bluetooth` on the host gives the number; set BLUETOOTH_GID if it differs.
    group_add:
      - "${BLUETOOTH_GID:-111}"
    healthcheck:
      # Loopback only. A static file, so the check does not depend on a phone or on Bluetooth.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/manifest.json').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      WS_NOTIFICATION_DATA: /app/data
      WS_SCRCPY_STREAM_CONFIG_PATH: /app/data/stream-config.json
      WS_PUBLIC_URL: https://mini-nuc.tailea1801.ts.net
    volumes:
      - ws-scrcpy-data:/app/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

      # iOS: the host's usbmuxd. It also serves the pairing records over this
      # socket, so /var/lib/lockdown does NOT need mounting.
      - /run/usbmuxd:/var/run/usbmuxd
      # Android: nothing to mount. The host adb server holds the adb identity and
      # has already authorised the device; the container only speaks to it on 5037.

  ws-scrcpy-dev:
    image: ws-scrcpy-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ws-scrcpy-dev
    init: true
    # See the production service: the server's shutdown budget is 70 s.
    stop_grace_period: 80s
    network_mode: host
    # Load config/apparmor-ws-scrcpy on the host before starting (see README).
    security_opt:
      - apparmor=ws-scrcpy-bluetooth
    cap_drop:
      - NET_RAW
    group_add:
      - "${BLUETOOTH_GID:-111}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/manifest.json').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first webpack build has to finish before anything is served.
      start_period: 180s
    environment:
      WS_NOTIFICATION_DATA: /app/data
      WS_SCRCPY_STREAM_CONFIG_PATH: /app/data/stream-config.json
      WS_PUBLIC_URL: https://mini-nuc.tailea1801.ts.net
    volumes:
      - ws-scrcpy-data:/app/data
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

      - /run/usbmuxd:/var/run/usbmuxd
      # Live sources; node_modules and the venv stay baked in the image.
      - ./src:/app/src
      - /app/node_modules
      - /app/python/venv

volumes:
  ws-scrcpy-data:
