name: Checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run test:browser
      - run: BROWSER=webkit npm run test:browser -- review-polish notifications motion
      # The build flags in webpack/default.build.config.json. Each platform must also build on its own.
      - name: Build without Android
        run: echo '{"INCLUDE_GOOG": false}' > build.config.override.json && npm run dist
      - name: Build without iPhone
        run: echo '{"INCLUDE_APPL": false}' > build.config.override.json && npm run dist
