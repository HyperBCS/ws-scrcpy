<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- This is a remote-control PWA: pinch gestures belong to the remote screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17191d" media="(prefers-color-scheme: dark)">
    <!-- The theme chosen in this browser, before the styles load: the first frame is in it. The
         build's hash keeps a cached copy from outliving its build, as it does for the bundle. -->
    <script src="theme.js?<%= compilation.hash %>"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <title>ws-scrcpy</title>
</head>

<body>
    <div id="root"></div>
</body>

</html>
